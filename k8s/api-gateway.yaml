apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: moleculer-app
          image: YOUR_DOCKERHUB_USERNAME/moleculer-conduit:latest
          imagePullPolicy: Always
          env:
            - name: SERVICES
              value: "services/api.service.js"
            - name: PORT
              value: "3000"
            - name: TRANSPORTER
              value: "nats://nats-service:4222"
            - name: MONGO_URI
              value: "mongodb://REPLACE_WITH_DB_PRIVATE_IP:27017/conduit"
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
    - port: 3000
      targetPort: 3000