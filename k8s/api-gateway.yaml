apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: moleculer-app
          image: mariaboukhelfa2025/moleculer-conduit:latest
          imagePullPolicy: Always
          env:
            - name: SERVICES
              value: "services/api.service.js"
            - name: PORT
              value: "3000"
          # Import shared variables (Mongo, NATS) from ConfigMap
          envFrom:
            - configMapRef:
                name: moleculer-env
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 32448