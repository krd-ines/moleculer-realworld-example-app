# eway is the "front door" of your app. It routes requests from the internet to your internal services.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      nodeSelector:
        role: api-master
      containers:
      - name: moleculer-app
        image: moleculer-registry:5000/moleculer-conduit:local
        imagePullPolicy: Always
        env:
        - name: SERVICES
          value: "services/api.service.js"            # Only starts the API service
        - name: PORT
          value: "3000"
        - name: TRANSPORTER
          value: "nats://nats-service:4222"
        - name: MONGO_URI
          value: "mongodb://mongo-service:27017/conduit"
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
spec:
  type: LoadBalancer # K3s (Klipper) will map this to the Master Node's port 3000
  selector:
    app: api-gateway
  ports:
  - port: 3000
    targetPort: 3000