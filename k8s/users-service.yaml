apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: users-service
  template:
    metadata:
      labels:
        app: users-service
    spec:
      containers:
        - name: moleculer-app
          image: mariaboukhelfa2025/moleculer-conduit:latest
          imagePullPolicy: Always
          env:
            - name: SERVICES
              value: "services/users.service.js"
          envFrom:
            - configMapRef:
                name: moleculer-env