apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-service
spec:
  replicas: 2 # You can scale this because you have 6 worker nodes!
  selector:
    matchLabels:
      app: metrics-service
  template:
    metadata:
      labels:
        app: metrics-service
    spec:
      containers:
      - name: moleculer-app
        image: moleculer-registry:5000/moleculer-conduit:local
        imagePullPolicy: Always
        env:
        - name: SERVICES
          value: "services/metrics.service.js"          # Only starts the Users service
        - name: TRANSPORTER
          value: "nats://nats-service:4222"
        - name: MONGO_URI
          value: "mongodb://mongo-service:27017/conduit"